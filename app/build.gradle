plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.tupackage.radardenormativas'
    compileSdk {
        version = release(36) {
            minorApiLevel = 1
        }
    }

    defaultConfig {
        applicationId "com.FlickStudio.RoadRulez"
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName "1.2"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'

    // ─── Dependencias existentes que ya pone Android Studio ───────────────────
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.core:core:1.13.1'

    // ─── ROOM (Base de datos local) ───────────────────────────────────────────
    def room_version = "2.7.1"
    implementation "androidx.room:room-runtime:$room_version"
    // Procesador de anotaciones: genera el código SQL por nosotros en compilación
    annotationProcessor "androidx.room:room-compiler:$room_version"

    // ─── GOOGLE PLAY SERVICES (GPS + Geofencing) ──────────────────────────────
    implementation 'com.google.android.gms:play-services-location:21.3.0'

    // ─── LIFECYCLE (necesario para ViewModel + LiveData con MVVM) ─────────────
    def lifecycle_version = "2.9.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"

    implementation 'androidx.recyclerview:recyclerview:1.3.2'

}